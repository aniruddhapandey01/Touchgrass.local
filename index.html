<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touchgrass.local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Touchgrass.local</h1>
    <p class="lead">A coach that runs inside your browser and sends you outside. What you type never leaves this device.</p>

    <section class="panel">
      <label for="model">Model</label>
      <div class="row">
        <select id="model">
          <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 2B</option>
          <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B</option>
          <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B</option>
        </select>
        <button id="load" type="button">Load model</button>
      </div>
      <progress id="bar" max="1" value="0" hidden></progress>
      <p id="status" role="status">No model loaded. You still get missions from the built-in list.</p>
    </section>

    <section class="panel">
      <label for="mood">How has your day gone so far?</label>
      <textarea id="mood" rows="3" placeholder="8 hours of screen time, foggy head, 15 minutes free"></textarea>
      <button id="ask" type="button">Get my mission</button>
    </section>

    <section id="card" class="panel mission" hidden>
      <h2 id="mission"></h2>
      <p id="nudge"></p>
      <button id="done" type="button">Mark done</button>
    </section>

    <p class="stats" id="stats"></p>
  </main>

  <div id="field" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
